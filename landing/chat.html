<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>چت کارکنان — MOLIDO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#07070c;color:#eef4ff;font-family:Vazirmatn,Tahoma,sans-serif;height:100vh;display:flex;flex-direction:column}
nav{display:flex;gap:10px;align-items:center;padding:12px 16px;border-bottom:1px solid #1e293b}
.logo{font-family:Orbitron,sans-serif;color:#00e5ff;letter-spacing:3px;margin-left:auto}
a{color:#00e5ff;text-decoration:none}
#log{flex:1;overflow:auto;padding:16px}
.msg{margin:8px 0;padding:10px 12px;border-radius:12px;max-width:80%}
.me{background:#164e63;margin-right:auto}
.ai{background:#0b1220;border:1px solid #1e293b}
form{display:flex;gap:8px;padding:12px;border-top:1px solid #1e293b}
input{flex:1;padding:12px;border-radius:12px;border:1px solid #334155;background:#070b14;color:#fff;font-family:inherit}
button{border:0;border-radius:12px;padding:12px 16px;background:#22d3ee;color:#042f2e;font-weight:700;cursor:pointer;font-family:inherit}
.err{color:#f87171;padding:0 16px}
</style>
</head>
<body>
<nav>
  <span class="logo">MOLIDO</span>
  <a href="/workforce.html">کارکنان</a>
  <a href="/panel.html">پنل</a>
</nav>
<div class="err" id="err"></div>
<div id="log"></div>
<form id="f">
  <input id="q" placeholder="پیام برای کارکنان مجازی" autocomplete="off" required>
  <button type="submit">ارسال</button>
</form>
<script>
const token=localStorage.getItem('molido_token');
const log=document.getElementById('log');
const err=document.getElementById('err');
function add(text,cls){const d=document.createElement('div');d.className='msg '+cls;d.textContent=text;log.appendChild(d);log.scrollTop=log.scrollHeight}
if(!token){err.textContent='برای چت وارد شوید';location.href='/enter.html'}
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const q=document.getElementById('q').value.trim();
  if(!q) return;
  document.getElementById('q').value='';
  add(q,'me');
  try{
    const r=await fetch('/api/v1/ai/chat',{
      method:'POST',
      headers:{'Content-Type':'application/json','Accept':'application/json','Authorization':'Bearer '+token},
      body:JSON.stringify({message:q})
    });
    const j=await r.json().catch(()=>({}));
    if(!r.ok) throw new Error(j.message||('خطا '+r.status));
    add(j.reply||j.message||j.content||JSON.stringify(j),'ai');
  }catch(x){add(x.message,'ai');err.textContent=x.message}
};
</script>
</body>
</html>
