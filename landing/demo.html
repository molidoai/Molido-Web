<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1"/>
<title>درخواست دمو — MOLIDO</title>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@700&family=Vazirmatn:wght@400;700&display=swap" rel="stylesheet">
<style>
:root{--bg:#07070c;--cyan:#00e5ff;--purple:#a78bfa;--w:#eef4ff;--m:#94a3b8}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:radial-gradient(800px 400px at 10% 100%,rgba(167,139,250,.14),transparent 45%),var(--bg);color:var(--w);font-family:Vazirmatn,Tahoma,sans-serif}
.wrap{width:440px;max-width:92vw}
.brand{font-family:Orbitron,sans-serif;letter-spacing:4px;text-align:center;font-size:26px;margin-bottom:8px;background:linear-gradient(90deg,#fff,var(--cyan),var(--purple));-webkit-background-clip:text;-webkit-text-fill-color:transparent}
.sub{text-align:center;color:var(--m);margin-bottom:20px}
.box{background:rgba(12,16,28,.86);border:1px solid rgba(255,255,255,.08);border-radius:22px;padding:26px}
label{display:block;font-size:13px;color:var(--m);margin:12px 0 6px}
input,select,textarea{width:100%;padding:12px;border-radius:12px;border:1px solid #334155;background:#070b14;color:#fff;font-family:inherit}
button{width:100%;margin-top:16px;padding:12px;border:0;border-radius:12px;background:linear-gradient(135deg,var(--cyan),#00b4d8);color:#021018;font-weight:700;cursor:pointer;font-family:inherit}
.err{min-height:20px;color:#f87171;margin-top:8px;font-size:13px}
.ok{color:#34d399}
.links{display:flex;justify-content:space-between;margin-top:14px;font-size:13px}
a{color:var(--cyan);text-decoration:none}
</style>
</head>
<body>
<div class="wrap">
  <div class="brand">MOLIDO</div>
  <p class="sub">درخواست دمو و پیش‌فاکتور</p>
  <form class="box" id="f">
    <label>نام</label><input id="name" required>
    <label>ایمیل</label><input id="email" type="email" required>
    <label>موبایل</label><input id="phone">
    <label>نرم‌افزار</label>
    <select id="sku">
      <option value="SHOP-WEB-PRO">فروشگاهی</option>
      <option value="REST-WEB-PRO">رستوران / کافی‌شاپ</option>
      <option value="CITY-MUNI-PRO">شهر الکترونیک</option>
      <option value="TRAVEL-WEB-PRO">همسفر</option>
    </select>
    <label>توضیح</label><textarea id="note" rows="3"></textarea>
    <div class="err" id="err"></div>
    <button type="submit">ارسال درخواست</button>
    <div class="links"><a href="/shop.html">کاتالوگ</a><a href="/enter.html">ورود</a></div>
  </form>
</div>
<script>
document.getElementById('f').onsubmit=async e=>{
  e.preventDefault();
  const err=document.getElementById('err'); err.textContent=''; err.className='err';
  const body={
    name:document.getElementById('name').value.trim(),
    email:document.getElementById('email').value.trim(),
    phone:document.getElementById('phone').value.trim(),
    source:'web-demo',
    title:document.getElementById('sku').value,
    notes:document.getElementById('note').value.trim()
  };
  try{
    const r=await fetch('/api/v1/crm/leads',{method:'POST',headers:{'Content-Type':'application/json','Accept':'application/json'},body:JSON.stringify(body)});
    const j=await r.json().catch(()=>({}));
    if(r.status===401){
      location.href='/register.html';
      return;
    }
    if(!r.ok) throw new Error(j.message||'ارسال نشد');
    err.className='err ok';
    err.textContent='درخواست ثبت شد';
    e.target.reset();
  }catch(x){err.textContent=x.message}
};
</script>
</body>
</html>
